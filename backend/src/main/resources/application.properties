spring.application.name=pdlc-assistant

# Project files: local folder for dev (an s3 mode comes later)
pdlc.storage.mode=local
pdlc.storage.root=${PDLC_DATA_DIR:./data/projects}

# Single admin account, credentials from environment variables
spring.security.user.name=${PDLC_ADMIN_USER:admin}
spring.security.user.password=${PDLC_ADMIN_PASSWORD:admin}

# LLM gateway. The key defaults to the OPENAI_API_KEY env var; for local dev put it in the untracked
# backend/config/application.properties as pdlc.llm.api-key=... (never in this tracked file)
pdlc.llm.api-key=${OPENAI_API_KEY:}
pdlc.llm.model=${PDLC_MODEL:gpt-4o-mini}
pdlc.llm.max-completion-tokens=1000
pdlc.llm.max-input-tokens=6000

# Archify (vendored Node CLI); the path is relative to the backend/ working dir
pdlc.archify.node=node
pdlc.archify.cli=../tools/archify/archify/bin/archify.mjs
pdlc.archify.timeout-seconds=60
pdlc.llm.router-model=${PDLC_ROUTER_MODEL:gpt-4o-mini}
# Optional stronger model for the product-interview document edits (empty = pdlc.llm.model)
pdlc.llm.discovery-model=${PDLC_DISCOVERY_MODEL:}
